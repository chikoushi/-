[project]
name = "mlstudy"
version = "0.1.0"
description = "工厂自动化场景下的机器学习学习项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0"]

[project.scripts]
train-quality = "mlstudy.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
